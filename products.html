<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionHub｜商品總覽</title>
    <link rel="stylesheet" href="products.css">

</head>
<body>

    <!-- ===== Navbar ===== -->
    <header class="site-header">
        <div class="nav-inner">
            <h1 class="logo">VisionHub</h1>

            <nav class="nav-links">
                <a href="index.html">首頁</a>
                <a href="allgoods.html">商品總覽</a>
                <a href="#">品牌介紹</a>
                <a href="#">聯絡我們</a>
            </nav>

            <!-- 登入/註冊按鈕（未登入時顯示） -->
            <div class="nav-actions" id="authButtons">
                <a class="btn-link" href="login.html">登入</a>
                <a class="btn-primary" href="register.html">註冊</a>
            </div>

            <!-- 使用者選單（登入後顯示） -->
            <div class="user-menu" id="userMenu" style="display: none;">
                <div class="user-info" onclick="toggleDropdown()">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span class="user-name" id="userName">使用者</span>
                </div>
                <div class="dropdown" id="dropdown">
                    <a href="#">我的帳戶</a>
                    <a href="#">訂單記錄</a>
                    <a href="#">收藏清單</a>
                    <hr>
                    <button onclick="logout()">登出</button>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== 滾動式廣告 ===== -->
    <section class="promo-marquee" aria-label="最新優惠">
        <div class="marquee">
            <div class="marquee-track">
                <span class="chip">新品上市｜極簡金屬鏡框</span>
                <span class="chip">全館滿 NT$999 免運</span>
                <span class="chip">抗藍光系列限時 8 折</span>
                <span class="chip">指定商品第二件 5 折</span>
                <span class="chip">學生專屬優惠開放中</span>

                <!-- 跑馬燈無縫循環 -->
                <span class="chip">新品上市｜極簡金屬鏡框</span>
                <span class="chip">全館滿 NT$999 免運</span>
                <span class="chip">抗藍光系列限時 8 折</span>
                <span class="chip">指定商品第二件 5 折</span>
                <span class="chip">學生專屬優惠開放中</span>
            </div>
        </div>
    </section>
    <section class="search-bar">
        <input type="text" placeholder="請輸入商品名稱、型號等關鍵字">
        <button class="filter-btn">進階篩選</button>
        <button class="clear-btn">清除篩選條件</button>
        <button class="search-btn">搜尋</button>
    </section>

<!-- 結果資訊 -->
    <section class="result-bar">
        <span>搜尋結果 <strong>522</strong> 件</span>
        <button class="sort-btn">排序方式 ⬍</button>
    </section>

<!-- 商品列表 -->
    <section class="product-grid">

        <a href="goods1.html" class="product-link">
            <article class="product-card">
            <button class="favorite" data-id="101"
                onclick="event.preventDefault(); event.stopPropagation();">♡</button>
            <img src="image/good1/good1-1.jpg">
            <p class="title">2026 潮流百搭厚邊框鈦輕盈系列</p>
            <p class="price">NT$3,980</p>
            <div class="colors">
                <span class="color beige"></span>
                <span class="color black"></span>
            </div>
            </article>
        </a>

        <a href="goods2.html" class="product-link">
            <article class="product-card">
            <button class="favorite" data-id="102"
                onclick="event.preventDefault(); event.stopPropagation();">♡</button>
            <img src="image/good2/good2-1.jpg">
            <p class="title">2026 潮流百搭厚邊框鈦輕盈系列</p>
            <p class="price">3,980</p>
            <div class="colors">
                <span class="color black"></span>
            </div>
            </article>
        </a>

        <a href="goods3.html" class="product-link">
            <article class="product-card">
            <button class="favorite" data-id="103"
                onclick="event.preventDefault(); event.stopPropagation();">♡</button>
            <img src="image/good3/good3-1.jpg">
            <p class="title">抗藍光學生款</p>
            <p class="price">NT$2,680</p>
            <div class="colors">
                <span class="color beige"></span>
            </div>
            </article>
        </a>

    </section>

    <footer>
        <div class="footer-content">
            <p>© 2025 VisionHub 眼鏡選品商城</p>
            <div>
                <a href="#">隱私權政策</a>
                <a href="#">服務條款</a>
            </div>
        </div>
    </footer>
    <script src="products.js" defer></script>
</body>
</html>
