<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會員中心 - 登入 / 註冊</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- ===== Navbar ===== -->
  <header class="site-header">
    <div class="nav-inner">
      <h1 class="logo">VisionHub</h1>

      <nav class="nav-links">
        <a href="index.html">首頁</a>
        <a href="products.html">商品總覽</a>
        <a href="#">品牌介紹</a>
        <a href="#">聯絡我們</a>
      </nav>

      <!-- 使用者選單（登入後顯示） -->
      <div class="user-menu" id="userMenu" style="display: none;">
        <div class="user-info" onclick="toggleDropdown()">
          <div class="user-avatar" id="userAvatar">U</div>
          <span class="user-name" id="userName">使用者</span>
        </div>
        <div class="dropdown" id="dropdown">
          <a href="#">我的帳戶</a>
          <a href="#">訂單記錄</a>
          <a href="#">收藏清單</a>
          <hr />
          <button onclick="logout()">登出</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== 滾動式廣告 ===== -->
  <section class="promo-marquee" aria-label="最新優惠">
    <div class="marquee">
      <div class="marquee-track">
        <span class="chip">新品上市｜極簡金屬鏡框</span>
        <span class="chip">全館滿 NT$999 免運</span>
        <span class="chip">抗藍光系列限時 8 折</span>
        <span class="chip">指定商品第二件 5 折</span>
        <span class="chip">學生專屬優惠開放中</span>

        <span class="chip">新品上市｜極簡金屬鏡框</span>
        <span class="chip">全館滿 NT$999 免運</span>
        <span class="chip">抗藍光系列限時 8 折</span>
        <span class="chip">指定商品第二件 5 折</span>
        <span class="chip">學生專屬優惠開放中</span>
      </div>
    </div>
  </section>

  <!-- ===== Member page (tabs) ===== -->
  <main class="member-page">
    <div class="member-shell">
      <div class="member-tabs" role="tablist" aria-label="會員登入/註冊切換">
        <button class="member-tab is-active" id="tabLogin" type="button" role="tab" aria-selected="true">
          會員登入
        </button>
        <button class="member-tab" id="tabRegister" type="button" role="tab" aria-selected="false">
          會員註冊
        </button>
      </div>

      <div class="member-panel">
        <!-- ========== Login ========== -->
        <section id="panelLogin" class="member-pane" role="tabpanel" aria-labelledby="tabLogin">
          <form id="loginForm" class="member-form">
            <div class="form-row">
              <label for="loginEmail">帳號</label>
              <input type="email" id="loginEmail" name="loginEmail" required placeholder="請輸入帳號(英文+數字)" />
            </div>

            <div class="form-row">
              <label for="loginPassword">密碼</label>
              <input type="password" id="loginPassword" name="loginPassword" required placeholder="請輸入密碼" />
            </div>

            <button type="submit" class="btn-submit member-btn-dark">登 入</button>

            <div class="member-links">
              <a href="#" class="member-link">忘記密碼</a>
              <span class="member-sep">|</span>
              <a href="#" class="member-link">忘記帳號</a>
            </div>

            <div class="member-hintline">
              還沒加入會員嗎？
              <a href="login.html?tab=register" class="member-cta">立即註冊</a>
            </div>
          </form>
        </section>

        <!-- ========== Register ========== -->
        <section id="panelRegister" class="member-pane is-hidden" role="tabpanel" aria-labelledby="tabRegister">
          <form id="registerForm" class="member-form" novalidate>
            <div class="member-divider"><span>帳號密碼設定</span></div>

            <div class="form-row" id="groupUsername">
              <label for="regUsername">使用者名稱</label>
              <div class="field-col">
                <input type="text" id="regUsername" name="regUsername" required placeholder="請輸入帳號(英文+數字)" />
                <div class="hint">2-16 個字元</div>
                <div class="error-text">請輸入 2-16 個字元的使用者名稱</div>
              </div>
            </div>

            <div class="form-row" id="groupEmail">
              <label for="regEmail">電子信箱</label>
              <div class="field-col">
                <input type="email" id="regEmail" name="regEmail" required placeholder="請輸入電子信箱" />
                <div class="error-text">請輸入正確的電子郵件格式</div>
              </div>
            </div>

            <div class="form-row" id="groupPassword">
              <label for="regPassword">密碼</label>
              <div class="field-col">
                <input type="password" id="regPassword" name="regPassword" required placeholder="請輸入密碼" />
                <div class="hint">至少 6 個字元</div>
                <div class="error-text">密碼至少 6 個字元</div>
              </div>
            </div>

            <div class="form-row" id="groupConfirm">
              <label for="regConfirmPassword">再次輸入密碼</label>
              <div class="field-col">
                <input type="password" id="regConfirmPassword" name="regConfirmPassword" required placeholder="請再次輸入密碼" />
                <div class="error-text">兩次密碼不一致</div>
              </div>
            </div>

            <div class="member-divider"><span>會員資料填寫</span></div>

            <div class="form-row">
              <label for="regRealName">真實姓名</label>
              <input type="text" id="regRealName" name="regRealName" placeholder="請輸入您的真實姓名" />
            </div>

            <div class="form-row">
              <label for="regPhone">手機號碼</label>
              <input type="tel" id="regPhone" name="regPhone" placeholder="請輸入您的手機號碼" />
            </div>

            <div class="terms member-terms">
              <label>
                <input type="checkbox" id="terms" name="terms" required />
                <span>我同意 <a href="#">服務條款</a> 和 <a href="#">隱私政策</a></span>
              </label>
            </div>

            <button type="submit" class="btn-submit member-btn-dark" id="submitBtn">註 冊</button>

            <div class="member-hintline">
              已經有帳戶了？
              <a href="login.html?tab=login" class="member-cta">立即登入</a>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script>
    // ===== Tabs =====
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const panelLogin = document.getElementById('panelLogin');
    const panelRegister = document.getElementById('panelRegister');

    function showTab(tab) {
      const isLogin = tab === 'login';

      tabLogin.classList.toggle('is-active', isLogin);
      tabRegister.classList.toggle('is-active', !isLogin);
      tabLogin.setAttribute('aria-selected', String(isLogin));
      tabRegister.setAttribute('aria-selected', String(!isLogin));

      panelLogin.classList.toggle('is-hidden', !isLogin);
      panelRegister.classList.toggle('is-hidden', isLogin);

      // URL 同步（不重整）
      const url = new URL(window.location.href);
      url.searchParams.set('tab', isLogin ? 'login' : 'register');
      window.history.replaceState({}, '', url.toString());
    }

    tabLogin.addEventListener('click', () => showTab('login'));
    tabRegister.addEventListener('click', () => showTab('register'));

    // 讀 query 參數決定開哪一個 tab
    const qsTab = new URLSearchParams(location.search).get('tab');
    if (qsTab === 'register') showTab('register');

    // ===== Login logic (localStorage demo) =====
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const user = users.find(u => u.email === email && u.password === password);

      if (user) {
        const currentUser = {
          username: user.username,
          email: user.email,
          loginAt: new Date().toISOString()
        };
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        alert('登入成功！歡迎回來，' + user.username + '！');
        window.location.href = 'index.html';
      } else {
        alert('帳號或密碼錯誤，請重試');
      }
    });

    // ===== Register logic (localStorage demo) =====
    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');

    const username = document.getElementById('regUsername');
    const email = document.getElementById('regEmail');
    const password = document.getElementById('regPassword');
    const confirmPassword = document.getElementById('regConfirmPassword');
    const terms = document.getElementById('terms');

    const groupUsername = document.getElementById('groupUsername');
    const groupEmail = document.getElementById('groupEmail');
    const groupPassword = document.getElementById('groupPassword');
    const groupConfirm = document.getElementById('groupConfirm');

    function setError(group, isError) {
      group.classList.toggle('error', !!isError);
    }

    function validateUsername() {
      const v = username.value.trim();
      const ok = v.length >= 2 && v.length <= 16;
      setError(groupUsername, !ok);
      return ok;
    }

    function validateEmail() {
      const v = email.value.trim();
      const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
      setError(groupEmail, !ok);
      return ok;
    }

    function validatePassword() {
      const v = password.value;
      const ok = v.length >= 6;
      setError(groupPassword, !ok);
      return ok;
    }

    function validateConfirm() {
      const ok = confirmPassword.value === password.value && confirmPassword.value.length > 0;
      setError(groupConfirm, !ok);
      return ok;
    }

    function validateAll() {
      return (
        validateUsername() &&
        validateEmail() &&
        validatePassword() &&
        validateConfirm() &&
        terms.checked
      );
    }

    username.addEventListener('input', validateUsername);
    email.addEventListener('input', validateEmail);
    password.addEventListener('input', () => { validatePassword(); validateConfirm(); });
    confirmPassword.addEventListener('input', validateConfirm);

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      if (!validateAll()) {
        alert('請確認欄位填寫正確並勾選同意條款');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '註冊中...';

      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const exists = users.some(u => u.email === email.value.trim());
      if (exists) {
        alert('此電子郵件已註冊，請直接登入');
        submitBtn.disabled = false;
        submitBtn.textContent = '註 冊';
        showTab('login');
        return;
      }

      const newUser = {
        username: username.value.trim(),
        email: email.value.trim(),
        password: password.value,
        createdAt: new Date().toISOString()
      };

      users.push(newUser);
      localStorage.setItem('users', JSON.stringify(users));

      alert('註冊成功！請登入');
      submitBtn.disabled = false;
      submitBtn.textContent = '註 冊';
      showTab('login');

      // 幫你把登入帳號預填，爽一點
      document.getElementById('loginEmail').value = newUser.email;
      document.getElementById('loginPassword').value = '';
    });
  </script>
</body>
</html>
