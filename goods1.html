<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionHub｜商品詳情</title>
  <link rel="stylesheet" href="goods.css">
</head>
<body>

    <!-- ===== 共用 風格 ===== -->
    <header class="site-header">
        <div class="nav-inner">
            <h1 class="logo">VisionHub</h1>
            <nav class="nav-links">
                <a href="index.html">首頁</a>
                <a href="allgoods.html">商品總覽</a>
                <a href="#">品牌介紹</a>
                <a href="#">聯絡我們</a>
            </nav>
            <div class="nav-actions">
                <a class="btn-link" href="login.html">登入</a>
                <a class="btn-primary" href="register.html">註冊</a>
            </div>
        </div>
    </header>

    <!-- ===== 共用 風格） ===== -->
    <section class="promo-marquee">
        <div class="marquee">
            <div class="marquee-track">
                    <span class="chip">新品上市｜極簡金屬鏡框</span>
                    <span class="chip">全館滿 NT$999 免運</span>
                    <span class="chip">抗藍光系列限時 8 折</span>
                    <span class="chip">指定商品第二件 5 折</span>
                    <span class="chip">學生專屬優惠開放中</span>

                    <!-- 跑馬燈無縫循環 -->
                    <span class="chip">新品上市｜極簡金屬鏡框</span>
                    <span class="chip">全館滿 NT$999 免運</span>
                    <span class="chip">抗藍光系列限時 8 折</span>
                    <span class="chip">指定商品第二件 5 折</span>
                    <span class="chip">學生專屬優惠開放中</span>
                </div>
        </div>
    </section>

    <!-- ===== 商品內容 ===== -->
    <main class="product-page">

        <div class="product-wrapper">

        <!-- 左側：圖片 -->
            <section class="product-gallery">
                <div class="thumb-list">
                    <img src="image/good1/good1-1.jpg" alt="">
                    <img src="image/good1/good1-2.jpg" alt="">
                    <img src="image/good1/good1-3.jpg" alt="">
                    <img src="image/good1/good1-4.jpg" alt="">
                    <img src="image/good1/good1-5.jpg" alt="">
                    <img src="image/good1/good1-6.jpg" alt="">
                </div>
                <div class="main-image">
                    <img src="image/good1/good1-1.jpg" alt="商品主圖">
                </div>
            </section>

        <!-- 右側：商品資訊 -->
            <section class="product-info">
                <h2 class="product-title">
                    2026 潮流百搭厚邊框鈦輕盈系列
                </h2>
                <div class="price-row">
                    <div class="price">NT$3,980</div>
                </div>

                <div class="rating" id="ratingSummary">
                    <span id="ratingStars">★★★★★</span>
                    <span id="ratingInfo">5.0（1 則評價）</span>
                </div>
                        <!-- 規格 -->
                        <div class="select-row">
                            <div class="spec-select">
                                <label for="spec">規格</label>
                                <div class="select-wrapper">
                                    <select id="spec">
                                        <option>金色 ‧ 195 ‧ Gold</option>
                                        <option>黑色 ‧ 195 ‧ Black</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <!-- 數量 -->
                        <div class="quantity-row">
                            <p class="option-title">數量</p>

                            <div class="qty-control">
                                <button id="minus">-</button>
                                <input type="number" id="qty" value="1" min="1">
                                <button id="plus">+</button>
                            </div>
                        </div>
                        <!-- 操作按鈕 -->
                        <div class="action-buttons">
                            <button class="btn-cart">加入購物車</button>
                            <button class="btn-buy">立即購買</button>
                        </div>

                    <p class="stock">現庫存剩下 1 件</p>

            </section>
    </div>
    <!-- =====  留言板 ===== -->

    <section class="message-board">
        <h2 class="board-title">留言板</h2>
        <!-- 星級 -->
        <div class="rating">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
            <span class="rating-text" id="ratingText">請選擇評分</span>
        </div>
        <!-- 留言輸入區 -->
        <div class="message-form">
            <input type="text" id="username" placeholder="您的姓名">
            <textarea id="message" placeholder="請輸入留言內容"></textarea>
            <button id="submitMessage">送出留言</button>
        </div>

        <!-- 留言顯示區 -->
        <div class="message-list" id="messageList">
            <!-- 留言會出現在這 -->
        </div>
    </section>
</main>

<!-- ===== Footer（共用） ===== -->
<footer>
    <div class="footer-content">
        <p>© 2025 VisionHub 眼鏡選品商城</p>
        <div>
            <a href="#">隱私權政策</a>
            <a href="#">服務條款</a>
        </div>
    </div>
</footer>

<script>
    // 商品圖片切換
    document.addEventListener("DOMContentLoaded", () => {
        const thumbnails = document.querySelectorAll(".thumb-list img");
        const mainImage = document.querySelector(".main-image img");

        thumbnails.forEach(thumb => {
            thumb.addEventListener("click", () => {
                mainImage.src = thumb.src;
            });
        });
    });

    // 加入購物車按鈕動畫
    const cartBtn = document.querySelector('.btn-cart');

    cartBtn.addEventListener('click', () => {
        cartBtn.classList.add('added');
        cartBtn.textContent = '已加入 ✔';

        setTimeout(() => {
        cartBtn.classList.remove('added');
        cartBtn.textContent = '加入購物車';
        }, 1500);
    });

    // 數量控制器
    const minusBtn = document.getElementById("minus");
    const plusBtn = document.getElementById("plus");
    const qtyInput = document.getElementById("qty");

    plusBtn.addEventListener("click", () => {
        qtyInput.value = parseInt(qtyInput.value) + 1;
    });

    minusBtn.addEventListener("click", () => {
        let current = parseInt(qtyInput.value);
        if (current > 1) {
            qtyInput.value = current - 1;
        }
    });

    // 留言板
    let selectedRating = 0;
        const stars = document.querySelectorAll(".star");
        const ratingText = document.getElementById("ratingText");
        const messageList = document.getElementById("messageList");

        // 星級點擊
        stars.forEach(star => {
            star.addEventListener("click", () => {
                selectedRating = star.dataset.value;

                stars.forEach(s => {
                    s.classList.toggle("active", s.dataset.value <= selectedRating);
                });

                ratingText.textContent = `評分：${selectedRating} 顆星`;
            });
        });

    // 送出留言
    document.getElementById("submitMessage").addEventListener("click", () => {
        const username = document.getElementById("username").value.trim();
        const message = document.getElementById("message").value.trim();

        if (!username || !message || selectedRating === 0) {
            alert("請填寫姓名、留言內容並選擇星級");
            return;
        }

        const newMessage = {
            username,
            message,
            rating: selectedRating,
            time: new Date().toLocaleString()
        };

        const messages = JSON.parse(localStorage.getItem("messages")) || [];
        messages.unshift(newMessage);
        localStorage.setItem("messages", JSON.stringify(messages));

        renderMessages();

        // 清空
        document.getElementById("username").value = "";
        document.getElementById("message").value = "";
        selectedRating = 0;
        stars.forEach(s => s.classList.remove("active"));
        ratingText.textContent = "請選擇評分";
    });

    // 顯示留言
    function renderMessages() {
        const messages = JSON.parse(localStorage.getItem("messages")) || [];
        messageList.innerHTML = "";

        messages.forEach(msg => {
            const div = document.createElement("div");
            div.className = "message-item";
            div.innerHTML = `
                <div class="message-header">
                    ${msg.username}
                    <span class="message-time">${msg.time}</span>
                </div>
                <div class="message-content">
                    ${"★".repeat(msg.rating)}${"☆".repeat(5 - msg.rating)}<br>
                    ${msg.message}
                </div>
            `;
            messageList.appendChild(div);
        });
    }

    // 頁面一載入就顯示
    document.addEventListener("DOMContentLoaded", renderMessages);

    //更新評論
    function updateRatingSummary() {
        const messages = JSON.parse(localStorage.getItem("messages")) || [];

        const ratingStars = document.getElementById("ratingStars");
        const ratingInfo = document.getElementById("ratingInfo");

        if (messages.length === 0) {
            ratingStars.textContent = "☆☆☆☆☆";
            ratingInfo.textContent = "0.0（0 則評價）";
            return;
        }

        const total = messages.reduce((sum, msg) => sum + Number(msg.rating), 0);
        const avg = (total / messages.length).toFixed(1);

        // 星星顯示（四捨五入）
        const fullStars = Math.round(avg);
        ratingStars.textContent =
            "★".repeat(fullStars) + "☆".repeat(5 - fullStars);

        ratingInfo.textContent = `${avg}（${messages.length} 則評價）`;
    }
    updateRatingSummary();
    document.addEventListener("DOMContentLoaded", () => {
        renderMessages();
        updateRatingSummary();
    });

</script>

</body>
</html>
