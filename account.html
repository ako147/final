<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionHub｜我的帳戶</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="account.css" />
</head>

<body>
  <!-- ===== Navbar ===== -->
  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="logo">VisionHub</a>

      <nav class="nav-links">
        <a href="index.html">首頁</a>
        <a href="products.html">商品總覽</a>
        <a href="team.html">組員介紹</a>
        <a href="about.html">聯絡我們</a>
      </nav>

      <!-- 未登入 -->
      <div class="nav-actions" id="authButtons">
        <a class="btn-link" href="login.html">登入</a>
        <a class="btn-primary" href="login.html?tab=register">註冊</a>
      </div>

      <!-- 已登入 -->
      <div class="user-menu" id="userMenu" style="display:none;">
        <div class="user-info" onclick="toggleDropdown()">
          <div class="user-avatar" id="userAvatar">U</div>
          <span class="user-name" id="userName">使用者</span>
        </div>

        <div class="dropdown" id="dropdown">
          <a href="account.html">我的帳戶</a>
          <a href="cart.html">購物車 <span class="cart-badge" id="cartCount">0</span></a>
          <hr>
          <button onclick="logout()">登出</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== 內容 ===== -->
  <main class="account-page">
    <!-- 未登入：提示登入/註冊 -->
    <section class="account-card" id="guestView" hidden>
      <h2 class="account-title">我的帳戶</h2>
      <p class="account-subtitle">你還沒登入欸，帳戶頁面先不讓你偷看 😌</p>

      <div class="account-cta">
        <a class="btn-primary" id="goLogin" href="login.html?tab=login&redirect=account.html">去登入</a>
        <a class="btn-ghost" id="goRegister" href="login.html?tab=register&redirect=account.html">去註冊</a>
      </div>
    </section>

    <!-- 已登入：帳戶內容 -->
    <section id="accountApp" hidden>
      <div class="account-head">
        <div>
          <h2 class="account-title">我的帳戶</h2>
          <p class="account-subtitle">管理你的基本資料與訂單紀錄</p>
        </div>
        <a class="btn-ghost" href="cart.html">查看購物車</a>
      </div>

      <div class="account-grid">
        <!-- 左側：使用者資訊 -->
        <aside class="account-card">
          <div class="profile-block">
            <div class="profile-avatar" id="profileAvatar">A</div>
            <div class="profile-meta">
              <div class="profile-name" id="profileName">使用者</div>
              <div class="profile-email" id="profileEmail">email@example.com</div>
            </div>
          </div>

          <div class="profile-info">
            <div class="info-row">
              <span class="label">登入時間</span>
              <span class="value" id="profileLoginAt">-</span>
            </div>
          </div>

          <div class="account-mini-nav">
            <button class="mini-tab active" data-acc-tab="profile">帳戶資料</button>
            <button class="mini-tab" data-acc-tab="orders">訂單紀錄</button>
          </div>
        </aside>

        <!-- 右側：內容區 -->
        <section class="account-card">
          <!-- Tab：帳戶資料 -->
          <div class="acc-panel" id="tab-profile">
            <h3 class="panel-title">帳戶資料</h3>
            <p class="panel-desc">
              顯示您目前註冊的基本資訊。
            </p>

            <div class="info-table">
              <div class="info-row">
                <span class="label">使用者名稱</span>
                <span class="value" id="infoUsername">-</span>
              </div>
              <div class="info-row">
                <span class="label">電子郵件</span>
                <span class="value" id="infoEmail">-</span>
              </div>
            </div>
          </div>

          <!-- Tab：訂單紀錄 -->
          <div class="acc-panel" id="tab-orders" hidden>
            <div class="orders-head">
              <div>
                <h3 class="panel-title">訂單紀錄</h3>
                <p class="panel-desc">你在購物車按「前往結帳」後，就會在這裡看到一筆訂單。</p>
              </div>
              <a class="btn-ghost" href="products.html">再去逛逛</a>
            </div>

            <div id="ordersEmpty" class="empty-box" hidden>
              目前沒有訂單紀錄，先去買一副眼鏡讓它有存在感 👓
            </div>

            <div id="ordersList" class="orders-list"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <p>© 2025 VisionHub 眼鏡選品商城</p>
      <div>
        <a href="privacy.html">隱私權政策</a>
        <a href="service.html">服務條款</a>
      </div>
    </div>
  </footer>

  <!-- 先載入 cart.js：提供 VHCart / 之後 badge 也能用 -->
  <script src="cart.js" defer></script>
  <script src="index.js" defer></script>
  <script src="account.js" defer></script>
</body>
</html>
