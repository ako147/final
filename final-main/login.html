<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 商品總覽</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>登入</h1>
                <p>歡迎回來，請輸入帳號資訊</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">電子郵件</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" required placeholder="至少 6 碼">
                </div>

                <div class="row-between">
                    <label class="checkbox">
                        <input type="checkbox" id="remember">
                        <span>記住我</span>
                    </label>
                    <a href="#" class="forgot-password">忘記密碼？</a>
                </div>

                <button type="submit" class="btn-submit">登入</button>
            </form>

            <div class="auth-footer">
                還沒有帳戶？ <a href="register.html">立即註冊</a>
            </div>

            <div class="back-home">
                <a href="index.html">← 返回首頁</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // 取得已註冊的使用者資料
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            // 尋找符合的使用者
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                // 登入成功，儲存登入狀態
                const currentUser = {
                    username: user.username,
                    email: user.email,
                    loginAt: new Date().toISOString()
                };
                
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                console.log('已儲存使用者資訊:', currentUser);
                
                alert('登入成功！歡迎回來，' + user.username + '！');
                
                // 立即跳轉回首頁
                window.location.href = 'index.html';
            } else {
                alert('電子郵件或密碼錯誤，請重試');
            }
        });
    </script>
</body>
</html>
