<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <title>VisionHub｜購物車</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- ===== Navbar ===== -->
  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="logo">VisionHub</a>

      <nav class="nav-links">
        <a href="index.html">首頁</a>
        <a href="products.html">商品總覽</a>
        <a href="team.html">組員介紹</a>
        <a href="about.html">聯絡我們</a>
      </nav>

      <!-- 登入/註冊按鈕（未登入時顯示） -->
      <div class="nav-actions" id="authButtons">
        <a class="btn-link" href="login.html">登入</a>
        <a class="btn-primary" href="register.html">註冊</a>
      </div>

      <!-- 使用者選單（登入後顯示） -->
      <div class="user-menu" id="userMenu" style="display:none;">
        <div class="user-info" onclick="toggleDropdown()">
          <div class="user-avatar" id="userAvatar">U</div>
          <span class="user-name" id="userName">使用者</span>
        </div>
        <div class="dropdown" id="dropdown">
          <a href="account.html">我的帳戶</a>
          <a href="cart.html">購物車 <span class="cart-badge" id="cartCount">0</span></a><hr>

          <button onclick="logout()">登出</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== 滾動式廣告 ===== -->
  <section class="promo-marquee" aria-label="最新優惠">
    <div class="marquee">
      <div class="marquee-track">
        <span class="chip">新品上市｜極簡金屬鏡框</span>
        <span class="chip">全館滿 NT$999 免運</span>
        <span class="chip">抗藍光系列限時 8 折</span>
        <span class="chip">指定商品第二件 5 折</span>

        <!-- duplicate for seamless marquee -->
        <span class="chip">新品上市｜極簡金屬鏡框</span>
        <span class="chip">全館滿 NT$999 免運</span>
        <span class="chip">抗藍光系列限時 8 折</span>
        <span class="chip">指定商品第二件 5 折</span>
      </div>
    </div>
  </section>

  <main class="page">
    <div class="cart-header">
      <div>
        <h2 class="cart-title">購物車</h2>
        <p class="cart-subtitle">確認品項與數量，準備結帳。</p>
      </div>

      <a class="btn-link" href="products.html">← 繼續逛逛</a>
    </div>

    <div class="cart-layout">
      <!-- Items -->
      <section class="cart-card">
        <div class="cart-card-head">
          <h3 class="cart-card-title">商品清單</h3>
          <button class="btn-ghost" id="clearCartBtn" type="button">清空</button>
        </div>

        <div id="cartItems" class="cart-items"></div>

        <div id="cartEmpty" class="cart-empty is-hidden">
          <p>目前購物車是空的，你這台車還沒上路 🚗</p>
          <a class="btn-primary" href="products.html">去逛商品</a>
        </div>
      </section>

      <!-- Summary -->
      <aside class="cart-card cart-summary">
        <h3 class="cart-card-title">訂單摘要</h3>

        <div class="summary-row">
          <span>小計</span>
          <span id="subtotal">NT$0</span>
        </div>

        <div class="summary-row">
          <span>運費</span>
          <span id="shipping">NT$0</span>
        </div>

        <div class="summary-row total">
          <span>總計</span>
          <span id="total">NT$0</span>
        </div>

        <button id="checkoutBtn" class="btn-primary btn-full" type="button">前往結帳</button>
      </aside>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <p>© 2025 VisionHub 眼鏡選品商城｜保留所有權利</p>
      <div>
        <a href="privacy.html">隱私權政策</a>
        <a href="service.html">服務條款</a>
      </div>
    </div>
  </footer>

  <script src="index.js" defer></script>
  <script src="cart.js" defer></script>
</body>
</html>
