<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <title>商店資訊｜VisionHub</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="logo">VisionHub</a>

      <nav class="nav-links">
            <a href="index.html">首頁</a>
            <a href="products.html">商品總覽</a>
            <a href="team.html">組員介紹</a>
            <a href="about.html">聯絡我們</a>
        </nav>

      <div class="nav-actions" id="authButtons">
        <a class="btn-link" href="./login.html">登入</a>
        <a class="btn-primary" href="./register.html">註冊</a>
      </div>

      <div class="user-menu" id="userMenu" style="display:none;">
        <div class="user-info" onclick="toggleDropdown()">
          <div class="user-avatar" id="userAvatar">U</div>
          <span class="user-name" id="userName">使用者</span>
        </div>
        <div class="dropdown" id="dropdown">
          <a href="account.html">我的帳戶</a>
          <a href="cart.html">購物車 <span class="cart-badge" id="cartCount">0</span></a><hr>
          <hr>
          <button onclick="logout()">登出</button>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <h2 style="font-size:26px; margin-bottom:12px;">商店資訊</h2>
    <p style="color:var(--muted); margin-bottom:18px;">
      歡迎透過以下資訊與我們聯繫，或直接前往門市體驗試戴。
    </p>
    <section style="background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 8px 20px rgba(0,0,0,.05); padding:18px 16px; margin-bottom:16px;">
    <h3 style="font-size:18px; margin-bottom:10px;">聯絡資訊</h3>

    <div style="display:grid; grid-template-columns: 160px 1fr; gap:10px; align-items:start;">

        <div style="color:var(--muted);">地址</div>
        <div>320314 桃園市中壢區中北路200號</div>

        <div style="color:var(--muted);">電話</div>
        <div>886-3-265-5402<br><span style="color:var(--muted); font-size:13px;"></span></div>

        <div style="color:var(--muted);">傳真</div>
        <div>886-3-265-5499</div>

    </div>
    </section>

    <!-- 地圖卡 -->
    <section style="background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 8px 20px rgba(0,0,0,.05); overflow:hidden;">
      <div style="padding:18px 16px; border-bottom:1px solid var(--line);">
        <h3 style="font-size:18px;">門市位置</h3>
        <p style="color:var(--muted); font-size:14px; margin-top:6px;">
          可直接使用 Google 地圖導航。
        </p>
      </div>

      <div style="width:100%; height:420px;">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3617.256606068759!2d121.2407764!3d24.957382700000004!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3468221447a0f021%3A0x2b86d2650bb8bcff!2z5Lit5Y6f5aSn5a24!5e0!3m2!1szh-TW!2stw!4v1749136497988!5m2!1szh-TW!2stw"
          width="100%" height="100%"
          style="border:0;"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </section>

    <!-- 留言表單-->
    <section style="margin-top:18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 8px 20px rgba(0,0,0,.05); padding:18px 16px;">
      <h3 style="font-size:18px; margin-bottom:10px;">留言給我們</h3>

      <form action="#" style="display:grid; gap:10px;">
        <input type="text" placeholder="姓名" style="padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg);" />
        <input type="email" placeholder="Email" style="padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg);" />
        <input type="text" placeholder="主旨" style="padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg);" />
        <textarea rows="6" placeholder="想說的內容..." style="padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg); resize:vertical;"></textarea>

        <button type="button" class="btn-primary" style="width:fit-content;">送出</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>© 2025 VisionHub 眼鏡選品商城｜保留所有權利</p>
      <div>
        <a href="#">隱私權政策</a>
        <a href="#">服務條款</a>
      </div>
    </div>
  </footer>

  <!-- 登入狀態 / 下拉 -->
  <script>
    function checkLoginStatus() {
      const currentUser = localStorage.getItem('currentUser');
      const authButtons = document.getElementById('authButtons');
      const userMenu = document.getElementById('userMenu');
      if (!authButtons || !userMenu) return;

      if (currentUser && currentUser !== 'null') {
        try {
          const user = JSON.parse(currentUser);
          authButtons.style.display = 'none';
          userMenu.style.display = 'block';

          const userName = document.getElementById('userName');
          const userAvatar = document.getElementById('userAvatar');
          if (userName && userAvatar) {
            userName.textContent = user.username;
            userAvatar.textContent = user.username.charAt(0).toUpperCase();
          }
        } catch (e) {
          localStorage.removeItem('currentUser');
          authButtons.style.display = 'flex';
          userMenu.style.display = 'none';
        }
      } else {
        authButtons.style.display = 'flex';
        userMenu.style.display = 'none';
      }
    }

    function toggleDropdown() {
      const dropdown = document.getElementById('dropdown');
      if (!dropdown) return;
      dropdown.classList.toggle('show');
    }

    function logout() {
      if (confirm('確定要登出嗎？')) {
        localStorage.removeItem('currentUser');
        alert('已成功登出');
        window.location.reload();
      }
    }

    document.addEventListener('click', function (event) {
      const userMenu = document.getElementById('userMenu');
      const dropdown = document.getElementById('dropdown');
      if (!userMenu || !dropdown) return;
      if (!userMenu.contains(event.target)) dropdown.classList.remove('show');
    });

    document.addEventListener('DOMContentLoaded', function () {
      checkLoginStatus();
    });

    window.addEventListener('storage', function (e) {
      if (e.key === 'currentUser') checkLoginStatus();
    });
  </script>
</body>
</html>
